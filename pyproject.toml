[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prumo"
version = "0.1.0"
description = "Camada de abstração reutilizável para automação determinística de interfaces gráficas"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Matheus Antonio Vivas Rocha" }]

dependencies = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "keyboard>=0.13.5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
ocr = [
    "winocr>=0.0.15; sys_platform == 'win32'",
    "pillow>=10.0",
]
anchors = [
    "opencv-python>=4.8.0",
    "numpy>=1.24",
]
uia = [
    "uiautomation>=2.0.18; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "win32_real: lê o estado real do Windows (só leitura, nunca mexe em mouse/teclado); pulado fora do Windows",
]

# Lint focado em BUG, não em estilo (ARCHITECTURE.md §9.14): o código segue o
# idioma que já tem, e reformatar tudo não tornaria nada mais seguro.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E9",    # erro de sintaxe
    "F",     # nome indefinido, import sem uso, variável redefinida...
    "B",     # armadilhas: zip sem strict, default mutável, assert de Exception...
    "BLE",   # except Exception sem justificativa
    "S110",  # try/except/pass
]

[tool.coverage.run]
source = ["prumo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
