# Lint, suíte e piso de cobertura a cada push e PR — em Windows, porque é lá
# que o prumo age (Win32, UI Automation). Os testes `win32_real` só leem o
# estado do SO e são pulados quando a sessão não tem janela visível.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o prumo com todos os extras
        run: python -m pip install -e ".[dev,anchors,ocr,uia]"
      - name: Lint (bugs, não estilo)
        run: python -m ruff check src tests
      - name: Suíte + piso de cobertura
        run: python -m pytest --cov=prumo -rs
